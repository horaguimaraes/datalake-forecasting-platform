name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest

  demo:
    # Runs the whole pipeline offline on the bundled sample, then queries the API it produced.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: fuellake demo --root /tmp/demo_lake
      - name: Serve and query the API
        run: |
          fuellake serve --root /tmp/demo_lake --port 8100 &
          for i in $(seq 1 30); do curl -fs http://localhost:8100/health && break || sleep 1; done
          curl -fs "http://localhost:8100/v1/forecast?product=GASOLINA" | grep -q '"points"'
          curl -fs "http://localhost:8100/v1/models" | grep -q '"champion"'
      - uses: actions/upload-artifact@v4
        with:
          name: demo-forecast-report
          path: /tmp/demo_lake/reports/forecast_report.html
